[tool.black]
line-length = 88
target-version = ['py311']
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true
include_trailing_comma = true
multi_line_output = 3

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
fix = true
exclude = ["__pycache__", ".venv", "env", "venv", "build", "dist"]

[tool.ruff.isort]
known-first-party = ["Ava"]
