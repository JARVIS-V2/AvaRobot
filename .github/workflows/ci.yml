name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your code
      - name: Check out repository
        uses: actions/checkout@v3

      # 2) Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"  # or any version you prefer

      # 3) Cache dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 4) Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 5) (Optional) Lint with flake8
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 6) (Optional) Format with black (in check mode)
      - name: Check code formatting with black
        run: |
          pip install black
          # --check: checks formatting instead of modifying files
          # --diff: displays what changes would be made
          black --check --diff .

      # 7) Run tests (pytest)
      - name: Run tests
        run: |
          pip install pytest
          pytest --maxfail=1 --disable-warnings -q

      # 8) (Optional) Build or package your application
      - name: Build/Package (if needed)
        run: |
          # Example: If you need to create a dist package
          # pip install setuptools wheel
          # python setup.py sdist bdist_wheel
          echo "No build steps defined, adjust if needed."
